<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Natanael</title>

    <style>

        /* Pengaturan halaman */
        body {
            margin: 0;
            padding: 20px;
            background-color: #f2f2f2;
            font-family: Arial, sans-serif;
        }

        /* Bagian contact */
        #contact {
            padding: 40px 20px;
        }

        /* Kotak formulir */
        .contact-form {
            width: 400px;
            max-width: 100%;
            box-sizing: border-box;
            margin: 0 auto;
            padding: 24px;
            border: 1px solid #cccccc;
            border-radius: 8px;
            background-color: white;
        }

        /* Judul formulir */
        .contact-form h2 {
            text-align: center;
            color: #333333;
        }

        /* Kelompok input */
        .form-group {
            margin-bottom: 16px;
        }

        /* Label */
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 6px;
        }

        /* Kolom input dan pesan */
        input,
        textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            border: 1px solid #cccccc;
            border-radius: 5px;
            font-family: Arial, sans-serif;
        }

        /* Efek saat kolom dipilih */
        input:focus,
        textarea:focus {
            outline: none;
            border-color: blue;
            background-color: #f0f8ff;
        }

        /* Tombol kirim */
        .btn-submit {
            background-color: blue;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-submit:hover {
            background-color: darkblue;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 20px;
        }

    </style>
</head>

<body>

    <main id="contact">

        <form class="contact-form">

            <h2>Hubungi Saya</h2>

            <div class="form-group">
                <label for="nama">Nama Lengkap</label>
                <input
                    type="text"
                    id="nama"
                    name="nama"
                    placeholder="Masukkan nama kamu"
                >
            </div>

            <div class="form-group">
                <label for="email">Alamat Email</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Masukkan email kamu"
                >
            </div>

            <div class="form-group">
                <label for="pesan">Pesan</label>
                <textarea
                    id="pesan"
                    name="pesan"
                    rows="5"
                    placeholder="Tulis pesan kamu di sini"
                ></textarea>
            </div>

            <button type="submit" class="btn-submit">
                Kirim Pesan
            </button>

        </form>

    </main>

    <footer>
        <a href="../index.html">Kembali ke Beranda</a>
    </footer>

</body>
</html>
