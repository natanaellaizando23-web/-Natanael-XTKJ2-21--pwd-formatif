<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Button Set</title>

    <style>

        /* Pengaturan halaman */
        body {
            background-color: #f2f2f2;
            font-family: Arial, sans-serif;
            padding: 30px;
        }

        /* Judul */
        h2 {
            color: #333333;
            font-size: 20px;
        }

        /* Pengaturan semua tombol */
        .btn {
            display: inline-block;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: bold;
            text-decoration: none;
        }

        /* Jarak antartombol */
        .button-group .btn {
            margin-right: 10px;
            margin-bottom: 10px;
        }

        /* Tombol pertama */
        .btn-primary {
            background-color: blue;
            color: white;
        }

        .btn-primary:hover {
            background-color: darkblue;
        }

        /* Tombol kedua */
        .btn-secondary {
            background-color: #dddddd;
            color: #222222;
        }

        .btn-secondary:hover {
            background-color: #bbbbbb;
        }

        /* Tombol ketiga */
        .btn-outline {
            background-color: transparent;
            border: 2px solid rgb(0, 120, 200);
            color: #222222;
        }

        .btn-outline:hover {
            background-color: rgba(0, 120, 200, 0.15);
        }

        /* Tombol keempat */
        .btn-send {
            background-color: rgb(30, 150, 80);
            color: white;
        }

        .btn-send:hover {
            background-color: darkgreen;
        }

    </style>
</head>

<body>

    <h2>Contoh Button</h2>

    <div class="button-group">

        <a href="#" class="btn btn-primary">Lihat Proyek</a>

        <a href="#" class="btn btn-secondary">Unduh CV</a>

        <a href="#" class="btn btn-outline">Hubungi Saya</a>

        <a href="#" class="btn btn-send">Kirim Pesan</a>

    </div>

    <footer>
        <a href="../index.html">Kembali ke Beranda</a>
    </footer>

</body>
</html>
