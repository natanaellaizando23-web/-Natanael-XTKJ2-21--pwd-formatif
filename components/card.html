
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Card</title>

    <style>
        /* 
           Perhitungan lebar tanpa border-box:
           320px + 40px padding + 4px border = 364px
        */

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            background-color: #f2f2f2;
            font-family: Arial, sans-serif;
        }

        .card {
            width: 320px;
            padding: 20px;
            border: 2px solid #cccccc;
            margin: 30px auto;
            background-color: white;
            border-radius: 8px;
        }

        .card img {
            width: 100%;
            height: 160px;
            display: block;
            object-fit: cover;
        }

        .card h3 {
            color: #263238;
            margin-bottom: 8px;
        }

        .card p {
            font-size: 15px;
            line-height: 1.5;
        }

        .card a {
            color: #1976d2;
            text-decoration: none;
        }

        footer {
            text-align: center;
            padding: 20px;
        }
    </style>
</head>

<body>

    <main>
        <article class="card">
            <img src="../assets/images/project.jpg" alt="Contoh proyek">

            <h3>Website Portofolio</h3>

            <p>
                Ini adalah salah satu contoh proyek
                yang saya buat untuk mempelajari
                HTML dan CSS.
            </p>

            <a href="../pages/profile.html">Lihat Profil</a>
        </article>
    </main>

    <footer>
        <a href="../index.html">Kembali ke Beranda</a>
    </footer>

</body>
</html>
