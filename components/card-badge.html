<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Card - Natanael</title>

    <style>

        /* Mengatur box model */
        * {
            box-sizing: border-box;
        }

        /* Mengatur halaman */
        body {
            margin: 0;
            background-color: #f2f2f2;
            font-family: Arial, sans-serif;
        }

        /* Mengatur kartu */
        .card {
            width: 320px;
            padding: 20px;
            border: 2px solid #cccccc;
            margin: 30px auto;
            background-color: white;
        }

        /* Mengatur gambar */
        .card img {
            width: 100%;
            height: 160px;
            display: block;
            object-fit: cover;
        }

        /* Mengatur judul kartu */
        .card h3 {
            color: #333333;
            margin-bottom: 8px;
        }

        /* Mengatur paragraf */
        .card p {
            font-size: 15px;
            line-height: 1.5;
        }

        /* Mengatur link */
        .card a {
            color: blue;
            text-decoration: none;
        }

        .card a:hover {
            text-decoration: underline;
        }

    </style>
</head>

<body>

    <main>

        <div class="card">

            <img src="../assets/images/background.jpg" alt="Gambar proyek">

            <h3>Proyek Website Portofolio</h3>

            <p>
                Ini adalah salah satu proyek latihan saya
                dalam mempelajari HTML dan CSS.
            </p>

            <a href="#">Lihat Proyek</a>

        </div>

    </main>

    <footer style="text-align: center; padding: 20px;">
        <a href="../index.html">Kembali ke Beranda</a>
    </footer>

</body>
</html>
